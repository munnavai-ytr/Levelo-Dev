<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Cyber Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div class="hud-item">SCORE: <span id="score-val">0</span></div>
      <div class="hud-item">SPEED: <span id="speed-val">1.0x</span></div>
      <div class="hud-item">BEST: <span id="best-val">0</span></div>
    </div>
    <div id="touch-controls">
      <button id="btn-left" class="touch-btn">◀ LEFT</button>
      <button id="btn-jump" class="touch-btn">▲ JUMP</button>
      <button id="btn-right" class="touch-btn">RIGHT ▶</button>
    </div>
    <div id="game-over-screen" class="hidden">
      <h2>CRASHED!</h2>
      <p id="final-stats">Score: 0</p>
      <button id="btn-restart">RESTART</button>
    </div>
  </div>
  <script src="/libs/three.min.js"></script>
  <script>
    if (typeof THREE === "undefined") {
      document.write("<script src=\"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js\"><\/script>");
    }
  </script>
  <script src="game.js"></script>
</body>
</html>
